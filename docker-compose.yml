services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resort
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: resort
    ports:
      - "5432:5432"
    volumes:
      - resort_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort -d resort"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  resort_postgres:
